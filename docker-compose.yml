version: '3.8'

services:
  app:
    build: .
    ports:
      - "8000:8000"
    volumes:
    - ./storage:/app/storage
    - ./logs:/app/logs
    env_file:
      - .env
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/docs"]
      interval: 30s
      timeout: 10s
      retries: 3